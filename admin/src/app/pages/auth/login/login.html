<app-auth-shell>
  <h1 class="text-[28px] font-bold tracking-tight text-ink-800">Welcome back</h1>
  <p class="mt-1 mb-8 text-sm text-slate-500">Sign in to manage your GPS tracker store.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-6">
    @if (error()) {
      <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error() }}</div>
    }

    <div>
      <label for="email" class="mb-2 block text-sm font-medium tracking-wide text-slate-600 uppercase">Email address</label>
      <div class="relative">
        <svg class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="you@company.com"
          class="h-[52px] w-full rounded-md border bg-white pr-4 pl-11 text-[15px] text-ink-800 outline-none transition placeholder:text-slate-400 focus:ring-4"
          [class]="fieldError('email') ? 'border-red-400 focus:border-red-500 focus:ring-red-500/10' : 'border-slate-200 focus:border-brand-600 focus:ring-brand-600/15'"
          [attr.aria-invalid]="!!fieldError('email')"
          [attr.aria-describedby]="fieldError('email') ? 'email-error' : null"
        />
      </div>
      @if (fieldError('email'); as msg) {
        <p id="email-error" class="mt-1.5 text-sm text-red-600">{{ msg }}</p>
      }
    </div>

    <div>
      <!-- <div class="mb-2 flex items-end justify-between">
        <label for="password" class="block text-sm font-medium tracking-wide text-slate-600 uppercase">Password</label>
        <a routerLink="/forgot-password" class="text-sm font-semibold text-brand-500 hover:text-brand-700 hover:underline">Forgot password?</a>
      </div> -->
      <div class="relative">
        <svg class="pointer-events-none absolute top-1/2 left-4 h-[18px] w-[18px] -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          class="h-[52px] w-full rounded-md border bg-white pr-12 pl-11 text-[15px] text-ink-800 outline-none transition placeholder:text-slate-400 focus:ring-4"
          [class]="fieldError('password') ? 'border-red-400 focus:border-red-500 focus:ring-red-500/10' : 'border-slate-200 focus:border-brand-600 focus:ring-brand-600/15'"
          [attr.aria-invalid]="!!fieldError('password')"
          [attr.aria-describedby]="fieldError('password') ? 'password-error' : null"
        />
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          class="absolute top-1/2 right-3 -translate-y-1/2 rounded p-1 text-slate-500 hover:text-slate-700 focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:outline-none"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <path d="m2 2 20 20" />
            </svg>
          } @else {
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (fieldError('password'); as msg) {
        <p id="password-error" class="mt-1.5 text-sm text-red-600">{{ msg }}</p>
      }
    </div>

    <label class="flex cursor-pointer items-center gap-2.5 text-[15px] text-slate-600 select-none">
      <input type="checkbox" formControlName="remember" class="h-[18px] w-[18px] cursor-pointer rounded accent-brand-500" />
      Keep me signed in
    </label>

    <button
      type="submit"
      [disabled]="loading()"
      class="flex h-[48px] w-full items-center justify-center gap-2 rounded-md bg-gradient-to-b from-brand-600 to-brand-500 text-[15px] font-semibold text-white shadow-lg shadow-brand-500/30 transition hover:from-brand-500 hover:to-brand-700 focus-visible:ring-4 focus-visible:ring-brand-600/30 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-70"
    >
      @if (loading()) {
        <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.3" stroke-width="3" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        </svg>
        Signing in…
      } @else {
        Sign In
        <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      }
    </button>
  </form>
</app-auth-shell>
