<div>
  <span class="mb-2 block text-[15px] text-gray-700">{{ label() }} <span class="text-red-500">*</span></span>
  <label
    [for]="inputId()"
    (dragover)="onDragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="onDrop($event)"
    class="group relative flex aspect-[4/3] cursor-pointer flex-col items-center justify-center overflow-hidden rounded-md border-2 border-dashed text-center transition"
    [class]="error() ? 'border-red-300 bg-red-50/40' : dragging() ? 'border-brand-500 bg-brand-50' : 'border-gray-300 bg-gray-50 hover:border-brand-500 hover:bg-brand-50'"
  >
    @if (loading()) {
      <svg class="h-6 w-6 animate-spin text-brand-500" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.3" stroke-width="3" />
        <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </svg>
    } @else if (preview(); as src) {
      <img [src]="src" [alt]="label()" class="absolute inset-0 h-full w-full object-cover" />
      <span class="absolute inset-x-0 bottom-0 bg-black/55 py-1.5 text-[13px] font-medium text-white opacity-0 transition group-hover:opacity-100 group-focus-within:opacity-100">Change photo</span>
    } @else {
      <svg class="mb-2 h-8 w-8 text-gray-400 group-hover:text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="9" cy="9" r="2" />
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
      </svg>
      <span class="px-3 text-[13px] text-gray-600"><span class="font-medium text-brand-500">Upload</span> or drop</span>
      @if (hint()) {
        <span class="mt-0.5 px-3 text-[12px] text-gray-400">{{ hint() }}</span>
      }
    }
    <input [id]="inputId()" type="file" class="sr-only" accept="image/jpeg,image/png,image/webp,image/gif" (change)="onSelected($event)" />
  </label>
  @if (error(); as msg) {
    <p class="mt-1.5 text-[13px] text-red-600">{{ msg }}</p>
  }
</div>
